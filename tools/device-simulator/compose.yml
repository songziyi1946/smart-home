name: homeos-device-lab
services:
  mqtt:
    image: eclipse-mosquitto:2.0.22
    ports:
      - "127.0.0.1:18883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.11.1
    ports:
      - "127.0.0.1:18123:8123"
    volumes:
      - ha-config:/config
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - mqtt
volumes:
  ha-config:
